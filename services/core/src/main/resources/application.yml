spring:
  application:
    name: core
  profiles:
    # 프로필을 정하지 않으면 local. 운영은 SPRING_PROFILES_ACTIVE로 따로 켠다
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

management:
  endpoints:
    web:
      exposure:
        include: health

auth:
  jwt:
    issuer: http://localhost:8080
    audience: http://localhost:8080
