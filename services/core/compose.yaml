# 로컬 개발용 PostgreSQL. ./gradlew bootRun 하면 Spring Boot가 자동으로 띄운다.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: core
      POSTGRES_USER: core
      POSTGRES_PASSWORD: core
    ports:
      # 내 컴퓨터(127.0.0.1)에서만 접속 가능. 호스트 포트는 비워 두면 Docker가 빈 포트를 고르고 Spring Boot가 찾아 연결한다
      - "127.0.0.1::5432"
