# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit 설정: https://docs.coderabbit.ai/reference/configuration

# 리뷰와 요약을 한국어로 작성
language: "ko-KR"

reviews:
  # quiet: 중요한 문제 위주로만 짧게 지적 (chill, assertive 순으로 깐깐해짐)
  profile: "quiet"
  auto_review:
    enabled: true
    # 기본 브랜치 외에 자동 리뷰할 base 브랜치.
    # develop: 기능 PR (사람 리뷰 없이 머지하므로 세부 리뷰는 CodeRabbit이 맡는다)
    # main: release·hotfix PR (기본 브랜치를 develop으로 바꾼 뒤에도 리뷰되도록)
    base_branches:
      - "develop"
      - "main"
